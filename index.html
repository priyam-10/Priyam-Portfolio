<!doctype html>
<html lang="en" class="scroll-smooth dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Immediate theme initialization: defaults strictly to dark theme on first preview -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('priyam_portfolio_theme');
          var theme = (saved === 'light') ? 'light' : 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary SEO Meta Tags -->
    <title>Priyam Singh | Data Analyst & Machine Learning Engineer</title>
    <meta name="title" content="Priyam Singh | Data Analyst & Machine Learning Engineer" />
    <meta name="description" content="Explore the portfolio of Priyam Singh, a Computer Science undergraduate specializing in Data Analytics and Machine Learning, featuring projects, technical skills and professional experience." />
    <meta name="keywords" content="Priyam Singh, Data Analyst, Machine Learning Engineer, Portfolio, Python, SQL, Power BI, Scikit-learn, Streamlit, Bhopal, SIRTE" />
    <meta name="author" content="Priyam Singh" />
    <meta name="theme-color" content="#0B0B10" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://priyam-portfolio.vercel.app/" />
    <meta property="og:title" content="Priyam Singh | Data Analyst & Machine Learning Engineer" />
    <meta property="og:description" content="Explore the portfolio of Priyam Singh, a Computer Science undergraduate specializing in Data Analytics and Machine Learning, featuring projects, technical skills and professional experience." />
    <meta property="og:image" content="/assets/profile/profile.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Priyam Singh | Data Analyst & Machine Learning Engineer" />
    <meta property="twitter:description" content="Explore the portfolio of Priyam Singh, a Computer Science undergraduate specializing in Data Analytics and Machine Learning, featuring projects, technical skills and professional experience." />
    <meta property="twitter:image" content="/assets/profile/profile.png" />

    <!-- Critical Image Preload for LCP Performance -->
    <link rel="preload" as="image" href="/assets/profile/profile.webp" type="image/webp" fetchpriority="high" />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8F4ED] dark:bg-[#0B0B10] text-[#29231F] dark:text-[#EDEDF2] font-sans antialiased overflow-x-hidden min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
