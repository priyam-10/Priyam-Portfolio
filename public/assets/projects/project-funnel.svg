<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#111625"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#F43F5E"/></linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#EA580C"/></linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Left: Multi-stage Marketing Funnel Geometry -->
  <g transform="translate(100, 100)">
    <text x="0" y="20" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">MULTI-STAGE CONVERSION FUNNEL</text>

    <!-- Stage 1: Awareness -->
    <polygon points="50,60 550,60 480,140 120,140" fill="url(#f1)" opacity="0.85"/>
    <text x="300" y="105" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Stage 1: Awareness (Impressions: 124,500)</text>

    <!-- Stage 2: Engagement / Consideration -->
    <polygon points="125,150 475,150 415,230 185,230" fill="url(#f2)" opacity="0.85"/>
    <text x="300" y="195" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Stage 2: Engagement (53,280 | 42.8%)</text>

    <!-- Stage 3: Lead Qualification -->
    <polygon points="190,240 410,240 365,320 235,320" fill="url(#f3)" opacity="0.85"/>
    <text x="300" y="285" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Stage 3: Qualified Leads (23,030 | 18.5%)</text>

    <!-- Stage 4: Conversion / Customer -->
    <polygon points="240,330 360,330 330,410 270,410" fill="url(#f4)" opacity="0.9"/>
    <text x="300" y="375" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Stage 4: Closed (7,720 | 6.2%)</text>
  </g>

  <!-- Right: Channel Attribution Analysis -->
  <g transform="translate(710, 100)">
    <rect width="390" height="475" rx="14" fill="#141926" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
    <text x="28" y="38" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ACQUISITION CHANNEL ATTRIBUTION</text>

    <!-- Channel bars -->
    <g transform="translate(28, 70)" font-family="Inter, sans-serif">
      <!-- Organic Search -->
      <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="500">Organic Search</text>
      <text x="334" y="18" fill="#38BDF8" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">34.2%</text>
      <rect y="28" width="334" height="10" rx="5" fill="#1E293B"/>
      <rect y="28" width="220" height="10" rx="5" fill="#38BDF8"/>

      <!-- Paid Search (PPC) -->
      <g transform="translate(0, 65)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="500">Paid Campaigns (SEM)</text>
        <text x="334" y="18" fill="#818CF8" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">28.5%</text>
        <rect y="28" width="334" height="10" rx="5" fill="#1E293B"/>
        <rect y="28" width="180" height="10" rx="5" fill="#818CF8"/>
      </g>

      <!-- Direct / Referral -->
      <g transform="translate(0, 130)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="500">Referrals & Partnerships</text>
        <text x="334" y="18" fill="#FB7185" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">21.8%</text>
        <rect y="28" width="334" height="10" rx="5" fill="#1E293B"/>
        <rect y="28" width="140" height="10" rx="5" fill="#FB7185"/>
      </g>

      <!-- Social Media -->
      <g transform="translate(0, 195)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="500">Email & Social Retargeting</text>
        <text x="334" y="18" fill="#FF8C00" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">15.5%</text>
        <rect y="28" width="334" height="10" rx="5" fill="#1E293B"/>
        <rect y="28" width="105" height="10" rx="5" fill="#FF8C00"/>
      </g>
    </g>

    <g transform="translate(28, 360)">
      <rect width="334" height="75" rx="8" fill="#1A2133" stroke="white" stroke-opacity="0.05"/>
      <text x="16" y="24" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" font-weight="600">CRITICAL BOTTLENECK IDENTIFIED</text>
      <text x="16" y="48" fill="#F87171" font-family="Inter, sans-serif" font-size="12" font-weight="600">-56.8% Attrition Stage 2 → Stage 3</text>
    </g>
  </g>
</svg>