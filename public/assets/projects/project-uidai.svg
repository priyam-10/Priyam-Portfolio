<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#111625"/>
    </linearGradient>
    <linearGradient id="areaUidai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Left: Demographic Update Cohort Curves -->
  <g transform="translate(100, 100)">
    <rect width="620" height="475" rx="14" fill="#141926" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
    <text x="28" y="38" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">DEMOGRAPHIC &amp; BIOMETRIC UPDATE VOLUME DISTRIBUTIONS</text>

    <g transform="translate(50, 75)">
      <line x1="0" y1="320" x2="520" y2="320" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="320" stroke="#334155" stroke-width="1"/>
      <text x="520" y="340" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="end">Age Cohorts (0 - 80+)</text>
      <text x="-10" y="-10" fill="#64748B" font-family="Inter, sans-serif" font-size="10">Update Frequency</text>

      <!-- Mandatory Biometric Update Spike at Age 5 and 15 -->
      <polygon points="0,290 40,280 80,100 110,240 180,260 220,60 250,220 350,240 450,260 520,280 520,320 0,320" fill="url(#areaUidai)"/>
      <path d="M 0 290 L 40 280 L 80 100 L 110 240 L 180 260 L 220 60 L 250 220 L 350 240 L 450 260 L 520 280" fill="none" stroke="#38BDF8" stroke-width="2.5"/>

      <!-- Annotations -->
      <circle cx="80" cy="100" r="5" fill="#FF8C00"/>
      <text x="80" y="80" fill="#FF8C00" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Age 5 (Mandatory)</text>

      <circle cx="220" cy="60" r="5" fill="#FF8C00"/>
      <text x="220" y="40" fill="#FF8C00" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Age 15 (Mandatory)</text>
    </g>

    <text x="28" y="445" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">UIDAI Hackathon 2026 // National Data Analytics Initiative</text>
  </g>

  <!-- Right: Digital Inclusion Disparity Index -->
  <g transform="translate(750, 100)">
    <rect width="350" height="475" rx="14" fill="#141926" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
    <text x="24" y="38" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">DIGITAL INCLUSION METRICS</text>

    <g transform="translate(24, 75)" font-family="Inter, sans-serif">
      <text x="0" y="18" fill="#E2E8F0" font-size="12">Urban Centers Update Velocity</text>
      <text x="300" y="18" fill="#34D399" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">89.2%</text>
      <rect y="28" width="300" height="8" rx="4" fill="#1E293B"/>
      <rect y="28" width="267" height="8" rx="4" fill="#34D399"/>

      <g transform="translate(0, 65)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12">Semi-Urban Onboarding</text>
        <text x="300" y="18" fill="#38BDF8" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">72.4%</text>
        <rect y="28" width="300" height="8" rx="4" fill="#1E293B"/>
        <rect y="28" width="217" height="8" rx="4" fill="#38BDF8"/>
      </g>

      <g transform="translate(0, 130)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12">Rural Last-Mile Disparity</text>
        <text x="300" y="18" fill="#F43F5E" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">48.1%</text>
        <rect y="28" width="300" height="8" rx="4" fill="#1E293B"/>
        <rect y="28" width="144" height="8" rx="4" fill="#F43F5E"/>
      </g>
    </g>

    <g transform="translate(24, 290)">
      <rect width="300" height="150" rx="8" fill="#1A2133" stroke="white" stroke-opacity="0.05"/>
      <text x="16" y="24" fill="#FF8C00" font-family="Inter, sans-serif" font-size="11" font-weight="700">POLICY RECOMMENDATIONS</text>
      <text x="16" y="52" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">• Mobile Camp Frequency Optimization</text>
      <text x="16" y="78" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">• School-based Biometric Update Drives</text>
      <text x="16" y="104" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">• Document Renewal Assistance Desks</text>
      <text x="16" y="130" fill="#34D399" font-family="JetBrains Mono, monospace" font-size="10">Target: 95% Inclusion Threshold</text>
    </g>
  </g>
</svg>