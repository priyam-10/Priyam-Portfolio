<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#111625"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Left: Retention Cohort Decay Curve -->
  <g transform="translate(100, 100)">
    <rect width="640" height="475" rx="14" fill="#141926" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
    <text x="28" y="38" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">TENURE RETENTION DECAY (KAPLAN-MEIER CURVES)</text>

    <g transform="translate(50, 80)">
      <line x1="0" y1="320" x2="540" y2="320" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="320" stroke="#334155" stroke-width="1"/>
      <text x="540" y="340" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="end">Tenure Months (0 - 36)</text>
      <text x="-10" y="-10" fill="#64748B" font-family="Inter, sans-serif" font-size="10">Retention %</text>

      <!-- Curve 1: Two Year Contract (High Retention) -->
      <path d="M 0 30 Q 250 50 520 80" fill="none" stroke="#34D399" stroke-width="2.5"/>
      <text x="525" y="85" fill="#34D399" font-family="Inter, sans-serif" font-size="10">2-Year: 88%</text>

      <!-- Curve 2: One Year Contract -->
      <path d="M 0 30 Q 220 90 520 160" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <text x="525" y="165" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10">1-Year: 62%</text>

      <!-- Curve 3: Month-to-Month Contract (Steep Attrition) -->
      <path d="M 0 30 Q 150 180 520 270" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
      <text x="525" y="275" fill="#F43F5E" font-family="Inter, sans-serif" font-size="10">Monthly: 31%</text>
    </g>
  </g>

  <!-- Right: Churn Risk Factor Analysis -->
  <g transform="translate(770, 100)">
    <rect width="330" height="475" rx="14" fill="#141926" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
    <text x="24" y="38" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">KEY CHURN HAZARD DRIVERS</text>

    <g transform="translate(24, 75)" font-family="Inter, sans-serif">
      <text x="0" y="18" fill="#E2E8F0" font-size="12">Fiber Optic + No TechSupport</text>
      <text x="280" y="18" fill="#F43F5E" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">+41.2% Risk</text>
      <rect y="28" width="280" height="8" rx="4" fill="#1E293B"/>
      <rect y="28" width="230" height="8" rx="4" fill="#F43F5E"/>

      <g transform="translate(0, 65)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12">Electronic Check Payment</text>
        <text x="280" y="18" fill="#FB7185" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">+32.6% Risk</text>
        <rect y="28" width="280" height="8" rx="4" fill="#1E293B"/>
        <rect y="28" width="180" height="8" rx="4" fill="#FB7185"/>
      </g>

      <g transform="translate(0, 130)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12">Monthly Charges > $75</text>
        <text x="280" y="18" fill="#F59E0B" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">+24.8% Risk</text>
        <rect y="28" width="280" height="8" rx="4" fill="#1E293B"/>
        <rect y="28" width="140" height="8" rx="4" fill="#F59E0B"/>
      </g>

      <g transform="translate(0, 195)">
        <text x="0" y="18" fill="#E2E8F0" font-size="12">Multi-Year Auto-Pay Contract</text>
        <text x="280" y="18" fill="#34D399" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="end">-68.4% Risk</text>
        <rect y="28" width="280" height="8" rx="4" fill="#1E293B"/>
        <rect y="28" width="260" height="8" rx="4" fill="#34D399"/>
      </g>
    </g>

    <g transform="translate(24, 370)">
      <rect width="280" height="75" rx="8" fill="#182030" stroke="white" stroke-opacity="0.05"/>
      <text x="14" y="24" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" font-weight="600">DAX RETENTION MEASURE</text>
      <text x="14" y="48" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="11">ActiveCust[t] / StartingCust[t0]</text>
    </g>
  </g>
</svg>