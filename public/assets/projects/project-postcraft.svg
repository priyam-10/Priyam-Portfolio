<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#111625"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="50%" stop-color="#FF3D71"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <g transform="translate(100, 100)">
    <text x="0" y="20" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AUTOMATED AI MEDIA SYNTHESIS ARCHITECTURE</text>

    <!-- Pipeline Flow Container -->
    <rect y="50" width="1000" height="425" rx="14" fill="#141926" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- Step 1: Prompt Script Input -->
    <g transform="translate(50, 100)">
      <rect width="180" height="150" rx="10" fill="#1A2133" stroke="white" stroke-opacity="0.08"/>
      <text x="20" y="35" fill="#38BDF8" font-family="Inter, sans-serif" font-size="12" font-weight="700">01. SCRIPT ENGINE</text>
      <text x="20" y="65" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">Text Input &amp; Prompt</text>
      <text x="20" y="90" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Regex Tokenizer</text>
      <text x="20" y="115" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Segment Timestamps</text>
    </g>

    <path d="M 230 175 L 290 175" stroke="#FF8C00" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Step 2: AI Voice Synthesis -->
    <g transform="translate(290, 100)">
      <rect width="190" height="150" rx="10" fill="#1A2133" stroke="white" stroke-opacity="0.08"/>
      <text x="20" y="35" fill="#818CF8" font-family="Inter, sans-serif" font-size="12" font-weight="700">02. VOICE SYNTHESIS</text>
      <text x="20" y="65" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">Text-to-Speech API</text>
      <text x="20" y="90" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Neural WAV Track</text>
      <text x="20" y="115" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Word Align SRT</text>
    </g>

    <path d="M 480 175 L 540 175" stroke="#FF3D71" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Step 3: FFmpeg Assembly -->
    <g transform="translate(540, 100)">
      <rect width="200" height="150" rx="10" fill="#1A2133" stroke="white" stroke-opacity="0.08"/>
      <text x="20" y="35" fill="#FF8C00" font-family="Inter, sans-serif" font-size="12" font-weight="700">03. FFMPEG PIPELINE</text>
      <text x="20" y="65" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">Multi-Layer Muxing</text>
      <text x="20" y="90" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Dynamic Subtitles</text>
      <text x="20" y="115" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">H.264 Video Stream</text>
    </g>

    <path d="M 740 175 L 800 175" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Step 4: Rendered Artifact -->
    <g transform="translate(800, 100)">
      <rect width="150" height="150" rx="10" fill="#14261F" stroke="#34D399" stroke-opacity="0.3"/>
      <text x="20" y="35" fill="#34D399" font-family="Inter, sans-serif" font-size="12" font-weight="700">04. OUTPUT</text>
      <text x="20" y="65" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">1080x1920 MP4</text>
      <text x="20" y="90" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Synced Reel</text>
      <text x="20" y="115" fill="#34D399" font-family="JetBrains Mono, monospace" font-size="10">Ready to Share</text>
    </g>

    <!-- Bottom Audio-Visual Waveform Track -->
    <g transform="translate(50, 300)">
      <rect width="900" height="120" rx="10" fill="#0E121E" stroke="white" stroke-opacity="0.05"/>
      <text x="24" y="28" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1">AUDIO-VISUAL SYNC TIMELINE</text>
      
      <!-- Waveform bars -->
      <g transform="translate(24, 45)" fill="#FF8C00" opacity="0.8">
        <rect x="0" y="15" width="6" height="20" rx="3"/><rect x="12" y="5" width="6" height="40" rx="3"/><rect x="24" y="0" width="6" height="50" rx="3"/><rect x="36" y="10" width="6" height="30" rx="3"/><rect x="48" y="18" width="6" height="15" rx="3"/>
        <rect x="60" y="8" width="6" height="35" rx="3"/><rect x="72" y="2" width="6" height="46" rx="3"/><rect x="84" y="12" width="6" height="26" rx="3"/><rect x="96" y="20" width="6" height="10" rx="3"/>
        <rect x="108" y="5" width="6" height="40" rx="3"/><rect x="120" y="0" width="6" height="50" rx="3"/><rect x="132" y="10" width="6" height="30" rx="3"/><rect x="144" y="18" width="6" height="15" rx="3"/>
        <rect x="156" y="8" width="6" height="35" rx="3"/><rect x="168" y="2" width="6" height="46" rx="3"/><rect x="180" y="12" width="6" height="26" rx="3"/><rect x="192" y="20" width="6" height="10" rx="3"/>
      </g>
      <text x="250" y="75" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="12">Asynchronous Task Queue // Celery &amp; Flask Worker</text>
    </g>
  </g>
</svg>